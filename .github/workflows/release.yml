name: Build, Release, and Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Linux (x64)
          # =========================
          - os: ubuntu-latest
            arch: x64
            filename: python-server-linux-x64
            binary: dist/python-server

          # =========================
          # Linux ARM64
          # =========================
          - os: ubuntu-24.04-arm
            arch: arm64
            filename: python-server-linux-arm64
            binary: dist/python-server

          # =========================
          # macOS (Intel)
          # =========================
          - os: macos-14
            arch: x64
            filename: python-server-macos-x64
            binary: dist/python-server

          # =========================
          # macOS ARM64
          # =========================
          - os: macos-15
            arch: arm64
            filename: python-server-macos-arm64
            binary: dist/python-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $(uname -s 2>/dev/null || echo Windows)"
          echo "Architecture: $(uname -m 2>/dev/null || echo Windows)"
          python --version

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller netifaces

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean \
            --hidden-import=netifaces \
            --name python-server \
            python_server.py

      - name: Rename artifact
        shell: bash
        run: |
          if [ -f "dist/python-server.exe" ]; then
            mv dist/python-server.exe "dist/${{ matrix.filename }}"
          elif [ -f "dist/python-server" ]; then
            mv dist/python-server "dist/${{ matrix.filename }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Release files:"
          ls -lah artifacts/

      - name: Set release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: python-server ${{ steps.release_tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # PyPI Publishing Job - FIXED
  # ============================================================
  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install twine

      - name: Build package for PyPI
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
